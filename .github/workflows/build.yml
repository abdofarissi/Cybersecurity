name: Build Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller customtkinter cryptography argon2-cffi pycryptodome

    - name: Build with PyInstaller
      run: pyinstaller --noconfirm --onedir --windowed --clean --name "Aegis_Crypto" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: Aegis_Crypto-${{ matrix.os }}
        path: dist/Aegis_Crypto*
