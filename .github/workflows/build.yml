name: Build Executables
on: [push]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Install dependencies
      run: pip install pyinstaller customtkinter cryptography argon2-cffi pycryptodome
      
    - name: Build EXE
      run: pyinstaller --noconfirm --onedir --windowed --clean --name "Aegis_Crypto" main.py
      
    - name: Upload EXE
      uses: actions/upload-artifact@v4
      with:
        name: Aegis_Crypto-Windows
        path: dist/
